<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk | V-Combat</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="aset/vcombat.css">
</head>
<body>
<div class="login card">
  <div class="logo" style="font-size:34px"><b>V</b>-Combat</div>
  <div class="muted sm">Prototipe: tidak ada login sungguhan. Pilih peran untuk melihat tampilannya.</div>
  <input type="email" placeholder="Email" aria-label="Email">
  <input type="password" placeholder="Kata sandi" aria-label="Kata sandi">
  <label class="muted sm">Masuk sebagai
    <select id="role"><option value="pelatih">Pelatih</option><option value="analis">Analis</option><option value="atlet">Atlet / wali</option></select>
  </label>
  <button class="pri" id="go">Masuk</button>
  <button onclick="alert('Pendaftaran perguruan belum aktif di prototipe.')">Daftarkan perguruan</button>
</div>
<script>
document.getElementById("go").onclick = function(){
  try{ localStorage.setItem("vc_role", JSON.stringify(document.getElementById("role").value)); }catch(e){}
  location.href = "beranda.html";
};
</script>
</body>
</html>
